# Demo credentials for a throwaway local cluster. Real deployments would inject these from a
# secret manager or sealed secrets, never commit them.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: txn
type: Opaque
stringData:
  POSTGRES_USER: txn
  POSTGRES_PASSWORD: txn
  POSTGRES_DB: txn
  DATABASE_URL: postgresql://txn:txn@postgres:5432/txn
