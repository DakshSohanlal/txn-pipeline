services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: txn
      POSTGRES_PASSWORD: txn
      POSTGRES_DB: txn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txn -d txn"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Airflow in "standalone" mode: webserver + scheduler in one container, SQLite metadata DB.
  # Fine for a demo; production would use Postgres metadata + LocalExecutor/Celery/Kubernetes.
  # Needs roughly 2 GB RAM. Run `docker compose stop airflow` to free it.
  airflow:
    build: ./airflow
    command: ["airflow", "standalone"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      DATABASE_URL: postgresql://txn:txn@postgres:5432/txn
      PYTHONPATH: /opt/airflow/project
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/project/pipeline:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
